<!DOCTYPE html>
<html>
<head>
    <title>My Personal Profile</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Californian-FB, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .hobbies input {
            width: auto;
        }

        .hobbies label {
            display: inline-block;
            margin-right: 12px;
            font-weight: normal;
        }

        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 7px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Personal Profile</h1>

    <p>Welcome! Please fill in your personal details.</p>

    <form action="ProfileServlet" method="post">

        <label>Full Name:</label>
        <input type="text" name="name" required>

        <label>Student ID:</label>
        <input type="text" name="studentID" required>

        <label>Program:</label>
        <select name="program" required>
            <option value="">-- Select Program --</option>
            <option value="Diploma in Computer Science">
                Diploma in Computer Science
            </option>
            <option value="Bachelor of Information Technology">
                Bachelor of Information Technology
            </option>
            <option value="Other">
                Other
            </option>
        </select>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Hobbies:</label>

        <div class="hobbies">
            <label>
                <input type="checkbox" name="hobbies" value="Reading">
                Reading
            </label>

            <label>
                <input type="checkbox" name="hobbies" value="Music">
                Music
            </label>

            <label>
                <input type="checkbox" name="hobbies" value="Travelling">
                Travelling
            </label>

            <label>
                <input type="checkbox" name="hobbies" value="Sports">
                Sports
            </label>
        </div>

        <label>Short Self-Introduction:</label>
        <textarea name="introduction" rows="5"
                  placeholder="Tell us about yourself..."
                  required></textarea>

        <button type="submit">Submit Profile</button>

    </form>

</div>

</body>
</html>
